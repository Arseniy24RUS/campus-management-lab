<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc">
  <title id="title">Campus Management Lab workflow</title>
  <desc id="desc">Dissertation materials become curated data, model inputs, alternatives and transparent browser results.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2 2 L12 7 L2 12 Z" fill="#17584e"/>
    </marker>
    <style>
      .bg{fill:#f8fbf8}
      .box{fill:#fff;stroke:#17584e;stroke-width:2.3}
      .soft{fill:#eef7d2}
      .footer{fill:#fff7e5;stroke:#d9a948;stroke-width:2}
      text{font-family:Arial, Helvetica, sans-serif;letter-spacing:0;fill:#0b302c}
      .title{font-size:30px;font-weight:700}
      .boxhead{font-size:27px;font-weight:700}
      .body{font-size:24px;fill:#4a5f59}
      .foot{font-size:23px;font-weight:700;fill:#0b302c}
      .arrow{stroke:#17584e;stroke-width:3.6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1000" height="850"/>
  <text class="title" x="52" y="56">Campus Management Lab:</text>
<text class="title" x="52" y="94">fixed source case, transparent choices</text>
  <rect class="box soft" x="70" y="124" width="860" height="176" rx="12"/>
<text class="boxhead" x="98" y="168">1. Source package</text>
<text class="body" x="98" y="210">D. V. Filippov dissertation materials and archive</text>
<text class="body" x="98" y="240">Tables, glossary, formulas and OMML fragments</text>
<text class="body" x="98" y="270">Used as a fixed source with explicit attribution</text>
  <line class="arrow" x1="500" y1="316" x2="500" y2="352"/>
  <rect class="box" x="70" y="370" width="860" height="188" rx="12"/>
<text class="boxhead" x="98" y="414">2. Curated model data</text>
<text class="body" x="98" y="456">16 official series, 69 observations, 420 E/M values</text>
<text class="body" x="98" y="486">RW, RT and PP calculations expose formulas</text>
<text class="body" x="98" y="516">Missing arrays and logs are marked, not invented</text>
  <line class="arrow" x1="500" y1="574" x2="500" y2="610"/>
  <rect class="box soft" x="70" y="628" width="860" height="176" rx="12"/>
<text class="boxhead" x="98" y="672">3. Case workflow</text>
<text class="body" x="98" y="714">Read a study case and change model inputs</text>
<text class="body" x="98" y="744">Charts, calendar and comparison table update</text>
<text class="body" x="98" y="774">Exports show source notes and method limits</text>
  <rect class="footer" x="70" y="818" width="860" height="26" rx="7"/>
  <text class="foot" x="88" y="838">Limit: no invented full graph, simulation log or deployment effect.</text>
</svg>
